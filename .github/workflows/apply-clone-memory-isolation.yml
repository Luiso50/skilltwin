name: Apply clone memory isolation

on:
  push:
    branches: [security/clone-memory-isolation-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_clone_memory_isolation.py
      - name: Commit patched server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cerebro/server.py
          git diff --cached --quiet && exit 0
          git commit -m "security: isolate clone conversation memory [skip ci]"
          git push
