name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        SKILLTWIN_USE_SQLITE: '1'
        SKILLTWIN_ADMIN_SECRET: test-secret-ci
      run: |
        python -m coverage run --source=cerebro,dep_desarrollo,dep_marketing,dep_legal,dep_operaciones -m unittest discover -s tests -v
        python -m coverage report --fail-under=65

    - name: Check imports
      run: |
        python -c "from dep_operaciones import database, security, gestor_ordenes, gestor_pagos"
        python -c "from dep_desarrollo import motor_clonacion"
        python -c "from cerebro import server"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linter
      run: pip install ruff

    - name: Run linter
      run: ruff check cerebro dep_desarrollo dep_marketing dep_operaciones dep_legal --select E,F,W --ignore E501

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t skilltwin:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run -d --name skilltwin-test \
          -p 8000:8000 \
          -e SKILLTWIN_ADMIN_SECRET=test-secret \
          skilltwin:${{ github.sha }}
        sleep 5
        curl -f http://localhost:8000/api/health || exit 1
        docker stop skilltwin-test
