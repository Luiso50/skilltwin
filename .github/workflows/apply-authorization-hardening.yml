name: Apply authorization hardening

on:
  push:
    branches: [security/authorization-e2e-v1]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'authorization hardening applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_authorization_hardening.py
      - name: Commit patched server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cerebro/server.py
          git diff --cached --quiet && exit 0
          git commit -m "security: authorization hardening applied [skip ci]"
          git push
