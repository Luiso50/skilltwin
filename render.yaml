services:
  - type: web
    name: skilltwin-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from dep_operaciones.database import init_database, migrar_json_a_sqlite; init_database(); migrar_json_a_sqlite()" && cd cerebro && python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    # Disco persistente para que la base de datos sobreviva entre deploys
    disk:
      name: skilltwin-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SKILLTWIN_USE_SQLITE
        value: "1"
      - key: SKILLTWIN_DB_PATH
        value: "/data/skilltwin.db"
      - key: SKILLTWIN_TRUST_PROXY
        value: "1"
      - key: SKILLTWIN_HSTS
        value: "1"
      - key: SKILLTWIN_CORS_ORIGINS
        value: "https://luiso50.github.io"
      - key: SKILLTWIN_PUBLIC_URL
        value: "https://skilltwin-api.onrender.com"
      - key: SKILLTWIN_ADMIN_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.zoho.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "teamskiltwinhq@zohomail.com"
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "teamskiltwinhq@zohomail.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
