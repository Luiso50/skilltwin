<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillTwin | Pago completado</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #040714;
      --surface: rgba(15, 23, 42, 0.92);
      --border: rgba(148, 163, 184, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #eab308;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 26%), var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      width: min(720px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.5rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
      text-align: center;
    }
    .badge { display: inline-block; margin-bottom: 1rem; padding: 0.45rem 0.9rem; border-radius: 999px; background: rgba(56, 189, 248, 0.12); color: var(--accent); font-weight: 700; }
    .badge.success { background: rgba(16, 185, 129, 0.12); color: var(--success); }
    .badge.pending { background: rgba(234, 179, 8, 0.12); color: var(--warning); }
    .badge.error { background: rgba(239, 68, 68, 0.12); color: #ef4444; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 3vw, 2.6rem); }
    p { color: var(--muted); line-height: 1.75; }
    .actions { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.8rem; }
    .btn { display: inline-block; padding: 0.9rem 1.35rem; border-radius: 999px; text-decoration: none; font-weight: 700; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #0ea5e9); color: white; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" id="status-badge">Verificando pago...</div>
    <div id="spinner-container"><div class="spinner"></div></div>
    <h1 id="title">Confirmando tu pago</h1>
    <p id="message">Estamos verificando el estado de tu transacción con Stripe.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/client-portal.html" id="btn-portal" style="display:none;">Ir al Portal de Clientes</a>
      <a class="btn btn-secondary" href="https://luiso50.github.io/skilltwin/" id="btn-home">Volver a la landing</a>
    </div>
  </main>

  <script>
    const API_BASE = '/api';
    
    async function confirmPayment() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      
      if (!sessionId) {
        showResult('contacto', 'Solicitud recibida', 'Tu solicitud ha sido recibida correctamente. El equipo te responderá en breve.');
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/stripe/confirm-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        
        const data = await res.json();
        
        if (data.success && data.paid) {
          showResult('success', '¡Pago completado!', 'Tu pago ha sido procesado exitosamente. La orden ha sido actualizada.');
        } else if (data.success && !data.paid) {
          showResult('pending', 'Pago pendiente', 'El pago está siendo procesado. Te notificaremos cuando se confirme.');
        } else {
          showResult('error', 'Error al verificar', 'No pudimos verificar el pago. Por favor contacta a soporte.');
        }
      } catch (err) {
        showResult('error', 'Error de conexión', 'No pudimos verificar el pago. Por favor intenta de nuevo o contacta a soporte.');
      }
    }
    
    function showResult(type, title, message) {
      const badge = document.getElementById('status-badge');
      const spinner = document.getElementById('spinner-container');
      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      const btnPortal = document.getElementById('btn-portal');
      
      spinner.style.display = 'none';
      titleEl.textContent = title;
      messageEl.textContent = message;
      
      badge.className = 'badge ' + type;
      
      if (type === 'success') {
        badge.textContent = '¡Pago exitoso!';
        btnPortal.style.display = 'inline-block';
      } else if (type === 'pending') {
        badge.textContent = 'Pago pendiente';
        btnPortal.style.display = 'inline-block';
      } else if (type === 'error') {
        badge.textContent = 'Error';
      } else {
        badge.textContent = 'Solicitud recibida';
        btnPortal.style.display = 'inline-block';
      }
    }
    
    confirmPayment();
  </script>
</body>
</html>
